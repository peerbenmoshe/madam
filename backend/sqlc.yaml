# sqlc reads the goose migrations as the schema (skipping their Down sections)
# and the .sql queries, and generates type-safe Go into internal/db.
# Regenerate with `make sqlc`; never edit the generated files.
version: "2"
sql:
  - engine: postgresql
    schema: migrations
    queries: internal/db/queries
    gen:
      go:
        package: db
        out: internal/db
        # pgx's native interface rather than database/sql.
        sql_package: pgx/v5
        # A Valid() method on every enum type, so Go can ask "is this one
        # of the values?" of the list the migrations define, instead of
        # keeping a second list (docs/tech-stack.md §6).
        emit_enum_valid_method: true
