name: CI

on:
  pull_request:
  push:
    branches: [main]
  # The "Run workflow" button: reruns CI on main and deploys, for when a merge
  # triggered no run (docs/build-log.md, 0a). Google refuses any other branch.
  workflow_dispatch:

# A newer commit on a PR cancels the older run. Runs on main are never
# cancelled, because they deploy: they queue instead, and GitHub keeps only the
# newest waiting run, so the latest commit on main is always the one deployed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The job name "ci" is the required status check on main. Renaming it blocks
  # every PR until branch protection is updated to the new name.
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # A throwaway Postgres, matching compose.yaml. Steps start only once the
    # health check passes: the same readiness rule as `make db-up`.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: madam
          POSTGRES_PASSWORD: madam
          POSTGRES_DB: madam
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U madam -d madam"
          --health-interval 1s
          --health-timeout 3s
          --health-retries 30

    env:
      # Turns on the tests that need a database (they skip without it). The
      # application role, as on the server, so the isolation test (I3) sees
      # Row Level Security. `make migrate-up` gives it this throwaway password.
      MADAM_TEST_DATABASE_URL: postgres://madam_app:madam_app@127.0.0.1:5432/madam?sslmode=disable

    steps:
      - uses: actions/checkout@v7

      # Reads the `go` line from go.mod. The cache also covers the tools
      # module, because building sqlc and goose from cold takes minutes.
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: |
            backend/go.sum
            tools/go.sum

      # Exactly the Node in .nvmrc, as on the laptop. The cache is npm's
      # download cache, keyed on the lockfile.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Dependabot updates the Dockerfile's node: tag but not .nvmrc. This
      # fails such a PR until .nvmrc (and so the laptop) moves too.
      - name: Node versions agree
        working-directory: .
        run: |
          nvmrc=$(cat .nvmrc)
          image=$(sed -n 's/^FROM node:\([^-]*\)-.*/\1/p' Dockerfile)
          echo ".nvmrc: $nvmrc, Dockerfile: $image"
          if [ "$nvmrc" != "$image" ]; then
            echo "::error::.nvmrc ($nvmrc) and the Dockerfile's node: tag ($image) must be the same version"
            exit 1
          fi

      - name: Frontend install
        working-directory: frontend
        run: npm ci

      # ESLint (type-aware), then Prettier's formatting check.
      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

      # tsc, then vite build, then the copy into backend/internal/web/assets,
      # so the Go steps below build, test and lint with the real frontend
      # embedded.
      - name: Frontend type check and build
        working-directory: .
        run: make frontend

      - name: Build
        run: go build ./...

      # Fails if someone edited the generated code or forgot `make sqlc`.
      - name: Generated code is current
        working-directory: .
        run: |
          make sqlc
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            git diff
            echo "::error::Generated code is out of date: run make sqlc and commit the result"
            exit 1
          fi

      # The Makefile's default DB=local points at the service container.
      # Runs as the owner madam, then sets madam_app's local password with
      # the runner's psql.
      - name: Migrate
        working-directory: .
        run: make migrate-up

      # -count=1: never reuse cached test results. Go can't see the
      # database, so a cached pass could hide a broken migration.
      - name: Test
        run: go test -race -count=1 ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Keep in sync with GOLANGCI_LINT_VERSION in the Makefile.
          version: v2.15.0
          working-directory: backend

      # Builds the production image (no push, no credentials), so a broken
      # Dockerfile can't reach main.
      - name: Build image
        working-directory: .
        run: docker build -t madam-server:ci .

      # Runs that image against the service Postgres and checks the page, a
      # deep link, the API, that nothing under /api/ reaches the page, and
      # the cache and security headers (deploy/smoke-test.sh). --network
      # host: the container reaches the database at 127.0.0.1, like the
      # tests. The loop waits until the server answers, never a fixed time.
      - name: Smoke test image
        working-directory: .
        run: |
          docker run -d --name smoke --network host \
            -e DATABASE_URL="$MADAM_TEST_DATABASE_URL" madam-server:ci
          for _ in $(seq 1 50); do
            curl -s -o /dev/null http://127.0.0.1:8080/api/health && break
            sleep 0.2
          done
          sh deploy/smoke-test.sh http://127.0.0.1:8080 || { docker logs smoke; exit 1; }

  # Deploys main to Cloud Run, only after the ci job has passed on the same
  # commit. No key exists: GitHub signs a token saying which repository, branch,
  # event and workflow this is, and Google exchanges it for a short-lived token
  # of madam-deployer only if all of it matches (docs/tech-stack.md §7, 0c′).
  deploy:
    needs: ci
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # id-token: write lets this job, and only this job, ask GitHub for the
    # signed token.
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7

      # Writes a credentials file (gha-creds-*.json, gitignored) that gcloud
      # then uses to act as madam-deployer.
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/966460417479/locations/global/workloadIdentityPools/github/providers/madam-deploy
          service_account: madam-deployer@madam-512309.iam.gserviceaccount.com

      # docker push authenticates through gcloud, as on the laptop. The runner
      # has gcloud preinstalled.
      - name: Docker login to Artifact Registry
        run: gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet

      # The laptop's target, so the deploy flags exist in one place only.
      - name: Deploy
        run: make deploy
