name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel an older run of the same branch when a newer commit arrives.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The job name "ci" is the required status check on main. Renaming it blocks
  # every PR until branch protection is updated to the new name.
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # A throwaway Postgres, matching compose.yaml. Steps start only once the
    # health check passes: the same readiness rule as `make db-up`.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: madam
          POSTGRES_PASSWORD: madam
          POSTGRES_DB: madam
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U madam -d madam"
          --health-interval 1s
          --health-timeout 3s
          --health-retries 30

    env:
      # Turns on the tests that need a database (they skip without it).
      MADAM_TEST_DATABASE_URL: postgres://madam:madam@127.0.0.1:5432/madam?sslmode=disable

    steps:
      - uses: actions/checkout@v7

      # Reads the `go` line from go.mod. The cache also covers the tools
      # module, because building sqlc and goose from cold takes minutes.
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: |
            backend/go.sum
            tools/go.sum

      - name: Build
        run: go build ./...

      # Fails if someone edited the generated code or forgot `make sqlc`.
      - name: Generated code is current
        working-directory: .
        run: |
          make sqlc
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            git diff
            echo "::error::Generated code is out of date: run make sqlc and commit the result"
            exit 1
          fi

      # The Makefile's default DB=local points at the service container.
      - name: Migrate
        working-directory: .
        run: make migrate-up

      # -count=1: never reuse cached test results. Go can't see the
      # database, so a cached pass could hide a broken migration.
      - name: Test
        run: go test -race -count=1 ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Keep in sync with GOLANGCI_LINT_VERSION in the Makefile.
          version: v2.15.0
          working-directory: backend

      # Builds the production image (no push, no credentials), so a broken
      # Dockerfile can't reach main.
      - name: Build image
        working-directory: .
        run: docker build -t madam-server:ci .
