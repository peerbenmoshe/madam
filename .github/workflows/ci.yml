name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel an older run of the same branch when a newer commit arrives.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The job name "ci" is the required status check on main. Renaming it blocks
  # every PR until branch protection is updated to the new name.
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      # Reads the `go` line from go.mod.
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Keep in sync with GOLANGCI_LINT_VERSION in the Makefile.
          version: v2.15.0
          working-directory: backend
